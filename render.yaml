databases:
  - name: infrascan-db
    databaseName: infrascan
    user: infrascan
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: infrascan-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: infrascan-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: /app/backend/uploads

  - type: web
    name: infrascan-frontend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: BACKEND_URL
        value: http://infrascan-api:10000
